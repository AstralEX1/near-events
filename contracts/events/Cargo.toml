[package]
name = "near-events"
description = "Kickback-style event escrow: equal USDC deposits, attendees split the pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AstralEX1/near-events"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[features]
# Testnet rehearsal only: oracle deadlines in minutes instead of days (see `ORACLE_HOUR_MS`).
short-windows = []

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
